<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <title>Player Registration | CA Sports Arena</title>
  <meta name="description" content="Create a player account at CA Sports Arena to reserve cricket and football turf slots with advance payments." />
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .auth-page-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-6);
      background: linear-gradient(135deg, #f0fdf4 0%, #f8faf9 100%);
    }
    .auth-card-white {
      width: 100%;
      max-width: 460px;
      background: #ffffff;
      border: 1px solid var(--border-light);
      border-radius: var(--radius-xl);
      padding: var(--space-8) var(--space-6);
      box-shadow: var(--shadow-card);
    }
  </style>
</head>
<body>

  <div class="auth-page-wrap">
    <div class="auth-card-white">
      <div style="text-align:center;margin-bottom:var(--space-6);">
        <a href="index.html" class="brand-link" style="justify-content:center;margin-bottom:var(--space-3);">
          <div class="brand-badge" style="background:#063923;color:#ffffff;">CA</div>
          <div class="brand-name">CA Sports <span>Arena</span></div>
        </a>
        <h1 style="font-family:var(--font-display);font-size:1.85rem;font-weight:800;text-transform:uppercase;color:var(--green-primary);margin-bottom:4px;">Register Account</h1>
        <p style="font-size:var(--text-sm);color:var(--text-secondary);margin:0 auto;">One-tap booking and verified slot reservations</p>
      </div>

      <form id="standaloneSignupForm" style="display:flex;flex-direction:column;gap:var(--space-4);">
        <div>
          <label style="display:block;font-size:var(--text-xs);font-weight:700;color:var(--text-secondary);text-transform:uppercase;margin-bottom:var(--space-1);" for="signupNameInput">Full Name / Team Name</label>
          <input type="text" id="signupNameInput" class="input-field-on-green" style="background:#f8faf9;border-color:var(--border-light);color:var(--text-primary);" placeholder="e.g. Aditya Magar" required autofocus />
          <span class="field-error-msg" id="signupNameErr" style="color:#ef4444;"></span>
        </div>

        <div>
          <label style="display:block;font-size:var(--text-xs);font-weight:700;color:var(--text-secondary);text-transform:uppercase;margin-bottom:var(--space-1);" for="signupPhoneInput">WhatsApp / Mobile Number</label>
          <input type="tel" id="signupPhoneInput" class="input-field-on-green" style="background:#f8faf9;border-color:var(--border-light);color:var(--text-primary);" placeholder="10-digit mobile (e.g. 9604715698)" maxlength="10" required />
          <span class="field-error-msg" id="signupPhoneErr" style="color:#ef4444;"></span>
        </div>

        <div>
          <label style="display:block;font-size:var(--text-xs);font-weight:700;color:var(--text-secondary);text-transform:uppercase;margin-bottom:var(--space-1);" for="signupSportInput">Primary Sport</label>
          <select id="signupSportInput" class="input-field-on-green" style="background:#f8faf9;border-color:var(--border-light);color:var(--text-primary);cursor:pointer;">
            <option value="Box Cricket">Box Cricket</option>
            <option value="5-a-side Football">5-a-side Football</option>
            <option value="Net Practice">Net Practice</option>
          </select>
        </div>

        <button type="submit" class="btn btn-primary" style="width:100%;font-size:1.05rem;margin-top:var(--space-2);">
          Complete Registration →
        </button>

        <div style="text-align:center;margin-top:var(--space-4);font-size:var(--text-sm);color:var(--text-secondary);">
          Already have an account? <a href="login.html" style="color:var(--green-primary);font-weight:700;">Sign In</a>
        </div>

        <div style="text-align:center;margin-top:var(--space-3);">
          <a href="index.html" style="font-size:var(--text-xs);color:var(--text-muted);">← Back to CA Sports Arena</a>
        </div>
      </form>
    </div>
  </div>

  <script src="config.js"></script>
  <script>
    document.getElementById('standaloneSignupForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const name = document.getElementById('signupNameInput').value.trim();
      const phone = document.getElementById('signupPhoneInput').value.trim();
      const sport = document.getElementById('signupSportInput').value;
      const nameErr = document.getElementById('signupNameErr');
      const phoneErr = document.getElementById('signupPhoneErr');

      let hasError = false;
      if (!name || name.length < 2) {
        nameErr.textContent = 'Please enter your name (min 2 characters).';
        hasError = true;
      } else {
        nameErr.textContent = '';
      }

      if (!/^[6-9]\d{9}$/.test(phone)) {
        phoneErr.textContent = 'Please enter a valid 10-digit Indian phone number.';
        hasError = true;
      } else {
        phoneErr.textContent = '';
      }

      if (hasError) return;

      localStorage.setItem('ca_user', JSON.stringify({ name, phone, sport }));
      window.location.href = 'booking.html';
    });
  </script>
</body>
</html>
