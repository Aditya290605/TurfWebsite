<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <title>Player Sign In | CA Sports Arena</title>
  <meta name="description" content="Sign in to your CA Sports Arena account to manage slot bookings, track advance payments, and speed up checkout." />
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .auth-page-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-6);
      background: linear-gradient(135deg, #f0fdf4 0%, #f8faf9 100%);
    }
    .auth-card-white {
      width: 100%;
      max-width: 440px;
      background: #ffffff;
      border: 1px solid var(--border-light);
      border-radius: var(--radius-xl);
      padding: var(--space-8) var(--space-6);
      box-shadow: var(--shadow-card);
    }
  </style>
</head>
<body>

  <div class="auth-page-wrap">
    <div class="auth-card-white">
      <div style="text-align:center;margin-bottom:var(--space-6);">
        <a href="index.html" class="brand-link" style="justify-content:center;margin-bottom:var(--space-3);">
          <div class="brand-badge" style="background:#063923;color:#ffffff;">CA</div>
          <div class="brand-name">CA Sports <span>Arena</span></div>
        </a>
        <h1 style="font-family:var(--font-display);font-size:1.85rem;font-weight:800;text-transform:uppercase;color:var(--green-primary);margin-bottom:4px;">Player Sign In</h1>
        <p style="font-size:var(--text-sm);color:var(--text-secondary);margin:0 auto;">Access your match history and rapid slot booking</p>
      </div>

      <form id="standaloneLoginForm" style="display:flex;flex-direction:column;gap:var(--space-4);">
        <div>
          <label style="display:block;font-size:var(--text-xs);font-weight:700;color:var(--text-secondary);text-transform:uppercase;margin-bottom:var(--space-1);" for="loginPhoneInput">Registered Mobile Number</label>
          <input type="tel" id="loginPhoneInput" class="input-field-on-green" style="background:#f8faf9;border-color:var(--border-light);color:var(--text-primary);" placeholder="10-digit mobile (e.g. 9604715698)" maxlength="10" required autofocus />
          <span class="field-error-msg" id="loginPhoneErr" style="color:#ef4444;"></span>
        </div>

        <div>
          <label style="display:block;font-size:var(--text-xs);font-weight:700;color:var(--text-secondary);text-transform:uppercase;margin-bottom:var(--space-1);" for="loginNameInput">Player Name (Optional)</label>
          <input type="text" id="loginNameInput" class="input-field-on-green" style="background:#f8faf9;border-color:var(--border-light);color:var(--text-primary);" placeholder="e.g. Aditya Magar" />
        </div>

        <button type="submit" class="btn btn-primary" style="width:100%;font-size:1.05rem;margin-top:var(--space-2);">
          Sign In to Account →
        </button>

        <div style="text-align:center;margin-top:var(--space-4);font-size:var(--text-sm);color:var(--text-secondary);">
          Don't have an account yet? <a href="signup.html" style="color:var(--green-primary);font-weight:700;">Register Here</a>
        </div>

        <div style="text-align:center;margin-top:var(--space-3);">
          <a href="index.html" style="font-size:var(--text-xs);color:var(--text-muted);">← Back to CA Sports Arena</a>
        </div>
      </form>
    </div>
  </div>

  <script src="config.js"></script>
  <script>
    document.getElementById('standaloneLoginForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const phone = document.getElementById('loginPhoneInput').value.trim();
      const name = document.getElementById('loginNameInput').value.trim() || 'Player';
      const err = document.getElementById('loginPhoneErr');

      if (!/^[6-9]\d{9}$/.test(phone)) {
        err.textContent = 'Please enter a valid 10-digit Indian phone number.';
        return;
      }

      err.textContent = '';
      localStorage.setItem('ca_user', JSON.stringify({ name, phone }));
      window.location.href = 'index.html#booking';
    });
  </script>
</body>
</html>
